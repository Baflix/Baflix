<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Get Premium - Baflix</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        body {
            background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 450px;
            width: 100%;
            background: linear-gradient(145deg, #1a1a1a, #2a1a1a);
            border-radius: 24px;
            padding: 30px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 20px 60px rgba(255, 215, 0, 0.1);
            text-align: center;
        }
        .logo {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #e50914, #f5f5f1);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 20px;
        }
        .crown { font-size: 4rem; color: #ffd700; margin-bottom: 15px; display: block; }
        h1 { color: #ffd700; font-size: 1.8rem; margin-bottom: 10px; }
        .subtitle { color: #aaa; font-size: 1rem; margin-bottom: 25px; line-height: 1.6; }
        .user-id-box {
            background: rgba(0,0,0,0.3);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.8rem;
            color: #aaa;
            word-break: break-all;
        }
        .user-id-box strong { color: #fff; }
        .status-box {
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .status-box.premium {
            background: rgba(40, 167, 69, 0.2);
            border: 1px solid #28a745;
            color: #28a745;
        }
        .status-box.free {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid #ffd700;
            color: #ffd700;
        }
        .status-box .big-icon { font-size: 3rem; display: block; margin-bottom: 10px; }
        .timer-box {
            background: rgba(0,0,0,0.4);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 215, 0, 0.15);
            margin-bottom: 25px;
        }
        .timer-box .label { color: #aaa; font-size: 0.85rem; }
        .timer-box .time { font-size: 2.5rem; font-weight: bold; color: #ffd700; }
        .btn-premium {
            background: linear-gradient(45deg, #ffd700, #f5a623);
            color: #000;
            border: none;
            padding: 16px 30px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.3);
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-premium:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 30px rgba(255, 215, 0, 0.5);
        }
        .btn-premium:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .btn-back {
            background: #333;
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-back:hover { background: #444; }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            color: #fff;
            padding: 15px 25px;
            border-radius: 12px;
            z-index: 9999;
            display: none;
            animation: toastIn 0.4s ease;
            border: 1px solid rgba(255,215,0,0.2);
            text-align: center;
            max-width: 90%;
        }
        .toast.show { display: block; }
        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(30px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #333;
            border-top-color: #ffd700;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .sync-status {
            font-size: 0.75rem;
            color: #666;
            margin-top: 15px;
        }
        .sync-status .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 5px;
        }
        .sync-status .dot.online { background: #28a745; }
        .sync-status .dot.offline { background: #dc3545; }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">Baflix</div>
        <span class="crown">👑</span>
        <h1>Get Premium Access</h1>
        <p class="subtitle">Unlock <strong>12 hours</strong> of premium access to download movies & series without any restrictions!</p>
        
        <div class="user-id-box">
            <i class="fas fa-fingerprint"></i> Your Unique ID: <strong id="user-id-display">Loading...</strong>
        </div>
        
        <div class="status-box" id="status-box">
            <span class="big-icon" id="status-icon">⏳</span>
            <div id="status-message">Checking premium status...</div>
        </div>
        
        <div class="timer-box">
            <div class="label">⏳ Premium Time Remaining</div>
            <div class="time" id="premium-timer">--:--:--</div>
        </div>
        
        <button class="btn-premium" id="unlock-btn">
            <i class="fas fa-unlock"></i> Unlock Premium (12 Hours)
        </button>
        
        <button class="btn-back" id="back-btn">
            <i class="fas fa-arrow-left"></i> Back to Baflix
        </button>
        
        <div class="sync-status">
            <span class="dot online" id="sync-dot"></span>
            <span id="sync-text">Synced with Firebase</span>
        </div>
    </div>

    <div class="toast" id="toast">
        <span id="toast-message">Premium unlocked!</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { 
            getFirestore, doc, getDoc, updateDoc, setDoc, 
            increment, serverTimestamp, onSnapshot, collection, addDoc 
        } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA3okSnZJrF9ooUp12KihKISR2VRZq5Ju8",
            authDomain: "baflix-man.firebaseapp.com",
            projectId: "baflix-man",
            storageBucket: "baflix-man.firebasestorage.app",
            messagingSenderId: "1041860946828",
            appId: "1:1041860946828:web:fa8b976dc07ced6ce704a9",
            measurementId: "G-XDZ9EFWCX5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const PREMIUM_DURATION_HOURS = 12;
        const BOT_USERNAME = 'BaflixStreamBot';
        let userId = null;
        let isPremiumActive = false;
        let premiumUntil = null;
        let premiumTimerInterval = null;
        let unsubscribePremium = null;

        // ===== DOM ELEMENTS =====
        const userIdDisplay = document.getElementById('user-id-display');
        const statusBox = document.getElementById('status-box');
        const statusIcon = document.getElementById('status-icon');
        const statusMessage = document.getElementById('status-message');
        const premiumTimer = document.getElementById('premium-timer');
        const unlockBtn = document.getElementById('unlock-btn');
        const backBtn = document.getElementById('back-btn');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toast-message');
        const syncDot = document.getElementById('sync-dot');
        const syncText = document.getElementById('sync-text');

        // ============================================
        // ===== SHOW TOAST =====
        // ============================================
        const showToast = (message, type = 'success') => {
            toastMessage.textContent = message;
            toast.className = 'toast show';
            if (type === 'success') toast.style.borderColor = '#28a745';
            else if (type === 'error') toast.style.borderColor = '#dc3545';
            else toast.style.borderColor = '#ffd700';
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        };

        // ============================================
        // ===== UPDATE STATUS UI =====
        // ============================================
        const updateStatusUI = (isPremium, data = null) => {
            if (isPremium && data) {
                statusBox.className = 'status-box premium';
                statusIcon.textContent = '✅';
                statusMessage.textContent = '🎉 Premium is ACTIVE!';
                unlockBtn.textContent = '✅ Premium Active';
                unlockBtn.disabled = true;
                isPremiumActive = true;
                premiumUntil = new Date(data.premiumUntil);
                syncDot.className = 'dot online';
                syncText.textContent = 'Premium Active - Synced';
                startTimer();
            } else {
                statusBox.className = 'status-box free';
                statusIcon.textContent = '🔓';
                statusMessage.textContent = 'Free User - Unlock Premium Now!';
                unlockBtn.textContent = '👑 Unlock Premium (12 Hours)';
                unlockBtn.disabled = false;
                isPremiumActive = false;
                premiumUntil = null;
                syncDot.className = 'dot online';
                syncText.textContent = 'Free User - Synced';
                if (premiumTimerInterval) {
                    clearInterval(premiumTimerInterval);
                    premiumTimerInterval = null;
                }
                premiumTimer.textContent = '--:--:--';
            }
        };

        // ============================================
        // ===== START TIMER =====
        // ============================================
        const startTimer = () => {
            if (premiumTimerInterval) {
                clearInterval(premiumTimerInterval);
            }
            
            premiumTimerInterval = setInterval(() => {
                if (!premiumUntil) {
                    clearInterval(premiumTimerInterval);
                    return;
                }
                
                const now = new Date();
                const diff = premiumUntil - now;
                
                if (diff <= 0) {
                    clearInterval(premiumTimerInterval);
                    premiumTimerInterval = null;
                    isPremiumActive = false;
                    premiumTimer.textContent = 'Expired';
                    statusBox.className = 'status-box free';
                    statusIcon.textContent = '🔓';
                    statusMessage.textContent = 'Free User - Unlock Premium Now!';
                    unlockBtn.textContent = '👑 Unlock Premium (12 Hours)';
                    unlockBtn.disabled = false;
                    showToast('⏰ Premium has expired. Unlock again!', 'warning');
                    return;
                }
                
                const hours = Math.floor(diff / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);
                
                premiumTimer.textContent = 
                    String(hours).padStart(2, '0') + ':' +
                    String(minutes).padStart(2, '0') + ':' +
                    String(seconds).padStart(2, '0');
            }, 1000);
        };

        // ============================================
        // ===== LISTEN PREMIUM STATUS =====
        // ============================================
        const listenPremiumStatus = (uid) => {
            if (!uid) return;
            
            if (unsubscribePremium) {
                unsubscribePremium();
                unsubscribePremium = null;
            }
            
            const userRef = doc(db, 'users', uid);
            
            unsubscribePremium = onSnapshot(userRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    console.log('📊 Premium status updated:', data);
                    
                    if (data.premiumUntil) {
                        const premiumDate = new Date(data.premiumUntil);
                        if (premiumDate > new Date()) {
                            updateStatusUI(true, data);
                            return;
                        }
                    }
                    
                    updateStatusUI(false, data);
                } else {
                    updateStatusUI(false);
                }
            }, (error) => {
                console.error('❌ Error:', error);
                statusMessage.textContent = '❌ Error loading status';
                syncDot.className = 'dot offline';
                syncText.textContent = 'Connection Error';
            });
        };

        // ============================================
        // ===== UNLOCK PREMIUM =====
        // ============================================
        const unlockPremium = async () => {
            if (!userId) {
                showToast('❌ User ID not found!', 'error');
                return;
            }
            
            try {
                unlockBtn.disabled = true;
                unlockBtn.innerHTML = '<span class="loading"></span> Processing...';
                
                const userRef = doc(db, 'users', userId);
                const userDoc = await getDoc(userRef);
                
                if (!userDoc.exists()) {
                    showToast('❌ User not found!', 'error');
                    unlockBtn.disabled = false;
                    unlockBtn.innerHTML = '👑 Unlock Premium (12 Hours)';
                    return;
                }
                
                const now = new Date();
                const premiumUntilDate = new Date(now.getTime() + (PREMIUM_DURATION_HOURS * 60 * 60 * 1000));
                
                // টোকেন তৈরি
                const token = 'premium_' + Date.now() + '_' + Math.random().toString(36).substring(2, 10);
                
                // ইউজার আপডেট
                await updateDoc(userRef, {
                    premiumUntil: premiumUntilDate.toISOString(),
                    premiumToken: token,
                    totalUnlocks: increment(1),
                    lastPremiumAt: serverTimestamp()
                });
                
                // টোকেন সেভ
                await setDoc(doc(db, 'premium_tokens', token), {
                    userId: userId,
                    token: token,
                    createdAt: serverTimestamp(),
                    expiresAt: premiumUntilDate.toISOString(),
                    isActive: true,
                    durationHours: PREMIUM_DURATION_HOURS
                });
                
                // লগ
                await addDoc(collection(db, 'premium_logs'), {
                    userId: userId,
                    token: token,
                    platform: 'ad_website',
                    unlockedAt: serverTimestamp(),
                    expiresAt: premiumUntilDate.toISOString(),
                    durationHours: PREMIUM_DURATION_HOURS
                });
                
                showToast('🎉 Premium unlocked successfully! 12 hours added.', 'success');
                
                unlockBtn.innerHTML = '✅ Premium Active';
                unlockBtn.disabled = true;
                
                // Firestore listener auto আপডেট করবে
                
            } catch (error) {
                console.error('❌ Error unlocking premium:', error);
                showToast('❌ Failed to unlock premium. Try again.', 'error');
                unlockBtn.disabled = false;
                unlockBtn.innerHTML = '👑 Unlock Premium (12 Hours)';
            }
        };

        // ============================================
        // ===== BACK TO MINI APP =====
        // ============================================
        const goBackToMiniApp = () => {
            window.location.href = `https://t.me/${BOT_USERNAME}?startapp=home`;
        };

        // ============================================
        // ===== INIT =====
        // ============================================
        const init = () => {
            // URL থেকে userId নিন
            const params = new URLSearchParams(window.location.search);
            userId = params.get('uid');
            
            if (!userId) {
                userIdDisplay.textContent = 'Not found!';
                statusMessage.textContent = '❌ Invalid request! Please try again.';
                return;
            }
            
            userIdDisplay.textContent = userId;
            
            // প্রিমিয়াম স্ট্যাটাস লিসেন করুন
            listenPremiumStatus(userId);
        };

        // ============================================
        // ===== EVENT LISTENERS =====
        // ============================================
        unlockBtn.addEventListener('click', unlockPremium);
        backBtn.addEventListener('click', goBackToMiniApp);

        // ============================================
        // ===== START =====
        // ============================================
        init();
    </script>
</body>
</html>
